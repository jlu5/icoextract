[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icoextract"
description = "Windows EXE icon extractor"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "James Lu", email = "james@overdrivenetworks.com" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: End Users/Desktop',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Operating System :: OS Independent',
    'Operating System :: POSIX',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
dependencies = [
    "pefile",
]
dynamic = ["version"]

[project.optional-dependencies]
thumbnailer = ["Pillow"]
win16 = ["nefile"]
dev = [
    "icoextract[thumbnailer]",
    "icoextract[win16]",
    "pdoc",
]

[project.scripts]
icoextract = "icoextract.scripts.extract:main"
icolist = "icoextract.scripts.icolist:main"
exe-thumbnailer = "icoextract.scripts.thumbnailer:main [thumbnailer]"

[tool.setuptools.packages.find]
include = ["icoextract", "icoextract.*"]

[tool.setuptools.dynamic]
version = { attr = "icoextract.version.__version__" }

[tool.pylint]
max-line-length = 120
